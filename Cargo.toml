[package]
name = "files"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A fast, native Rust file manager powered by GPUI"
license = "MIT"

[dependencies]
gpui-kit = "=0.7.1"
notify = "8"
walkdir = "2.5"
trash = "5"
open = "5"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 8
