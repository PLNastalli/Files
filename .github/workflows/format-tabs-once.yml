name: Format tabs
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and remove temporary workflow
        shell: pwsh
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-tabs-once.yml
          git add src
          git commit -m "style: rustfmt reference-style folder tabs"
          git push origin HEAD:main
