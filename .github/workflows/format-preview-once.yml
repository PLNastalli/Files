name: Format preview milestone

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run Rustfmt and self-remove
        shell: pwsh
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-preview-once.yml
          git add src
          git commit -m "style: format preview pane and navigation improvements"
          git push origin HEAD:main
