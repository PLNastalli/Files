name: Format reference ribbon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and remove one-time workflow
        shell: pwsh
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-ribbon-once.yml
          git add src
          git commit -m "style: format reference Ribbon and Explorer grid"
          git push origin HEAD:main
